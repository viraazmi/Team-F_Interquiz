name: lalamu_app
description: "Aplikasi latihan soal pendidikan."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Versi-versi yang terbukti stabil
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/book.png
    - assets/catatan.png
    - assets/centang.png
    - assets/congratulation.png
    - assets/home.png
    - assets/jam.png
    - assets/light-bulb.png
    - assets/profil.png
    - assets/ranking.png
    - assets/silang.png
    - assets/spinner.png
    - assets/tombolkembali.png
